[package]
name = "gmcp"
version = "0.1.0"
edition = "2024"
description = "Scoped Google portal: API, web UI, CLI and MCP server over SQLite"
license = "MIT"
default-run = "gmcp"

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie-private", "typed-header"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
hex = "0.4"
hkdf = "0.12"
http = "1"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
lettre = { version = "0.11", default-features = false, features = ["builder"] }
mail-parser = "0.11"
mime_guess = "2"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
percent-encoding = "2"
quick-xml = "0.42"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "3.2.0", features = ["server", "transport-streamable-http-server", "macros"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
wiremock = "0.6"
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 4
